# README
# This defines the pipeline of jobs that runs when you push to gitlab
# To check the validity of this file, try the live editor:
# https://gitlab.fit.nasa.gov/coda/coda/-/ci/lint

stages:
  - stageless

default:
  timeout: 10 minutes

variables:
  HOME: "/tmp" # required for openshift for now
  a11y_urls: "https://coda-int.fit.nasa.gov/view?date=2021-03-13&gmt=14:49:46&v=2.0&l=n&s=0&f1=01001iss064m010721435&f2=01011iss064m020721435&f3=0300&f4=0701&f5=051&f6=04&f7=080"
  CURRENT_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images/node:20.11.0-alpine"
  FUTURE_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images/node:21-alpine"

# Default image unless otherwise specified
image: "$CURRENT_NODE_VERSION_IMAGE"

# also run standard FIT dependency and package checks
# https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates
include:
  - project: "developer-ecosystem/ci-job-templates"
    ref: 5.4.3
    file: "/rollups/all-projects.gitlab-ci.yml"
  - template: "Verify/Accessibility.gitlab-ci.yml"

  # Code quality checks
  - project: "emss/gitlab-templates"
    ref: 2.2.0
    file: "/jobs/code-quality.gitlab-ci.yml"

  # EMSS shared dev server helpers (carbon, iron, oxygen, etc)
  - project: "emss/gitlab-templates"
    ref: 2.2.0
    file: "/jobs/emss-shared-dev.gitlab-ci.yml"

  # Fitdock deploy template
  - project: "emss/gitlab-templates"
    ref: 2.2.0
    file: "/jobs/fitdock-deploy.gitlab-ci.yml"

  # Kaniko build template
  - project: "emss/gitlab-templates"
    ref: 2.2.0
    file: "/jobs/kaniko-build.gitlab-ci.yml"

  - project: "emss/gitlab-templates"
    ref: 2.2.0
    file: "/jobs/container-retag.gitlab-ci.yml"

# Override some properties on FIT jobs. Unfortunately using a template for these
# make GitLab angry, so a lot of repetition
project-check:
  stage: stageless
  needs: []
nodejs-scan-sast:
  stage: stageless
  needs: []
semgrep-sast:
  stage: stageless
  needs: []
sast:
  stage: stageless
  needs: []
secret_detection:
  stage: stageless
  needs: []
code-count:
  stage: stageless
  needs: []
yaml-lint:
  stage: stageless
  needs: []
  script:
    - CONFIG_FILES=".yamllint .yamllint.yaml .yamllint.yml"
    - CONFIG_FILE=""
    - |
      for filename in $CONFIG_FILES; do
        if [ -e "$filename" ]; then
          CONFIG_FILE="$filename"
          break
        fi
      done
    - |
      if [ -z "${CONFIG_FILE}" ]; then
        yamllint -d relaxed .
      else
        yamllint -c ${CONFIG_FILE} .
      fi
job-report-visualization:
  stage: stageless
  needs: []
deprecated-keywords:
  stage: stageless
  needs: []
file-count:
  stage: stageless
  needs: []
a11y:
  stage: stageless

dependency-check:
  stage: stageless
  tags: ["docker", "linux"] # can't use openshift (yet?)
  needs: ["install_dependencies"] # dependency-check takes a while, don't wait for "test" job
  rules:
    - if: '$CI_COMMIT_BRANCH == "int" || $CI_COMMIT_BRANCH == "prod"'

npm-audit:
  stage: stageless
  image: $CI_REGISTRY/emss/docker-images/node-ci:npm-audit
  needs: []
  tags: ["openshift"]
  allow_failure: true
  script:
    # Runs `npm audit --json` then sends the results to EMSS dashboard (only on EMSS major branches)
    - >
      if
      [ "${CI_COMMIT_REF_SLUG}" == "prod" ] ||
      [ "${CI_COMMIT_REF_SLUG}" == "int" ] ||
      [ "${CI_COMMIT_REF_SLUG}" == "stable" ] ||
      [ "${CI_COMMIT_REF_SLUG}" == "beta" ] ||
      [ "${CI_COMMIT_REF_SLUG}" == "alpha" ];
      then
        node /postAuditReport.js;
      fi

    # Run this without --json to make a pretty-print for the job log, plus will pass/fail the job
    - npm audit

install_dependencies:
  stage: stageless
  # This could be openshift, but it runs faster in a VM; other jobs rely on it, so get it done ASAP
  tags: ["docker", "linux"]
  script:
    - npm ci
  artifacts:
    expire_in: 1 day
    paths:
      - ./node_modules/*

#
# Creates Software Bill of Materials
#
node-sbom:
  stage: stageless
  allow_failure: true
  tags: ["docker", "linux"] # Can't be openshift due to it not pulling latest tag
  needs: ["install_dependencies"]
  image: $CI_REGISTRY/emss/docker-images:node-ci-sbom
  script:
    - /create-and-compare-bom.sh ./BOM.md
  artifacts:
    when: always
    paths:
      - "./bom.json"
      - "./new-bom.md"
    expire_in: 1 day

.make-dotenv-template:
  image: "$CURRENT_NODE_VERSION_IMAGE"
  stage: stageless
  needs: []
  tags: ["docker", "linux"] # needs to do global install, so needs to be root
  before_script:
    # Determine the versions of @emss/make-dotenv and tsx defined in package-lock.json
    # This allows us to be sure the same versions are used in CI as are used in local dev
    - MAKE_DOTENV_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@emss/make-dotenv'].version")
    - TSX_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/tsx'].version")

    # Globally install these packages. This allows us to use them without installing
    # all packages specified in package.json, which takes 1-4 minutes depending on the
    # repository.
    #
    # Other options:
    #   1. We could make this job have `needs: ['install_dependencies']`, but that means
    #      this job would be delayed running 1-4 minutes, which then delays container
    #      builds 1-4 minutes.
    #   2. We could have the emss/packages build a make-dotenv docker image tagged by its
    #      version number, and then this job could run using that image by specifying
    #      `image: $CI_REGISTRY/emss/packages/make-dotenv:x.y.z`. That would save some
    #      time since we wouldn't need to install global packages each time, but the job
    #      as-written runs in about 10 seconds, so we wouldn't be saving much. We would
    #      be causing ourselves some problems, though, since we'd have a version of
    #      @emss/make-dotenv specified in package(-lock).json, and then we'd have another
    #      version specified on the docker image on this job. We'd have to be careful to
    #      keep the two in sync. The current job as-written seems simpler and good enough.
    - npm i -g "@emss/make-dotenv@${MAKE_DOTENV_VERSION}" --userconfig ./.npmrc
    - npm i -g "tsx@${TSX_VERSION}"
  script:
    # Copy contents of DOTENV_SECRET from CI/CD variables to a new .env.secret file
    - echo "${DOTENV_SECRET_TS}" > ./env.secret.ts

    # Determine which docker image type (dev, int, or prod) to deploy based on branch
    # Append the commit sha in order to ensure the correct build is being deployed in the case
    # multiple devs are building images simutaneously
    - >
      if [ "${CI_COMMIT_REF_SLUG}" == "prod" ]; then
        IMAGE_VERSION="prod-${CI_COMMIT_SHORT_SHA}"
      elif [ "${CI_COMMIT_REF_SLUG}" == "int" ]; then
        IMAGE_VERSION="int-${CI_COMMIT_SHORT_SHA}"
      else
        IMAGE_VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      fi

    # Save image version into a an artifact to be read later in other jobs
    - echo "IMAGE_VERSION=${IMAGE_VERSION}" >> pipelineVariables.env
    # Export the variable so it can be read inside the make-dotenv
    - export IMAGE_VERSION

    - make-dotenv $MAKE_DOTENV_ENVIRONMENT
  artifacts:
    reports:
      dotenv: pipelineVariables.env
    paths:
      - .env
    expire_in: 1 day

make-dotenv:
  extends: .make-dotenv-template
  variables:
    MAKE_DOTENV_ENVIRONMENT: fit

make-test-dotenv:
  extends: .make-dotenv-template
  variables:
    MAKE_DOTENV_ENVIRONMENT: test

test:
  stage: stageless
  variables:
    # define variables used by Node app
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_PORT: 5432
    DB_NAME: aegis

    # plug those same variables into the Postgres container we're spinning up
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: aegis
  services:
    # image should match database used in docker-compose.yml
    - name: $CI_REGISTRY/emss/docker-images/postgres:postgis-14-alpine
      alias: postgres-test-container
  needs:
    - install_dependencies
    - make-test-dotenv
  tags: ["docker", "linux"]
  script:
    - npm run migrate:up
    - npm run lint
    - npm run tsc
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - ./coverage/*
    expire_in: 1 day

# test against next version of node that CODA may use, but allow to fail
test-node-next:
  stage: stageless
  image: "$FUTURE_NODE_VERSION_IMAGE"
  needs:
    - install_dependencies
    - make-dotenv
  tags: ["openshift"]
  allow_failure: true
  script:
    - npm run lint
    - npm run tsc
    - npm t

#
# Build container images
# Vite is not used in production, so we don't need to build it
#

.kaniko-build-template:
  extends: .emss-kaniko-build # use job template from gitlab-templates repo
  stage: stageless
  needs:
    - make-dotenv
  before_script:
    # required for containers to have NASA CA cert
    - echo "${ENV_LOCAL_CERT_PEM}" > ./.env.local.cert.pem

#
# Build docker images immediately
# SERVICE_NAME = name of service from docker-compose.yml (key in services object)
#
docker:build:nginx:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nginx
    MULTISTAGE_TARGET: prod
    NGINX_BASE_IMAGE: eegitlabregistry.fit.nasa.gov/emss/docker-images/nginx:1.23.0-alpine
    NODE_BASE_IMAGE: $CURRENT_NODE_VERSION_IMAGE
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      NGINX_BASE_IMAGE
      NODE_BASE_IMAGE
      VITE_PUBLIC_MAPBOX_KEY
      VITE_PUBLIC_APP_ENV
      VITE_PUBLIC_LIVE_STREAMS_ENABLED
      VITE_PUBLIC_MEDIA_MTX_CONTROL_URL
      VITE_PUBLIC_MEDIA_MTX_HLS_URL
      VITE_PUBLIC_MEDIA_MTX_RECORDINGS_URL

docker:build:apiv1:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: apiv1
    MULTISTAGE_TARGET: prod
    APIV1_BASE_IMAGE: $CURRENT_NODE_VERSION_IMAGE
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      APIV1_BASE_IMAGE

#
# Retag docker images after necessary jobs pass (e.g. unit testing passes)
#
docker:retag:
  extends: .emss-container-retag
  needs:
    - make-dotenv
    - job: test
      artifacts: false
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      apiv1

deploy:artifactize-committed-files:
  image: "$CI_REGISTRY/emss/docker-images:envsubst-bash-in-envsubst"
  stage: stageless
  needs: []
  tags: ["openshift"]
  script:
    - echo "This job runs no commands, just turns .fitdock.yml and docker-compose.yml into artifacts"
  artifacts:
    paths:
      - .fitdock.yml
      - docker-compose.yml
    expire_in: 1 day

.deploy-template:
  extends: .emss-fitdock-deploy # use job template from gitlab-templates repo
  stage: stageless
  timeout: 10 minutes

deploy:carbon:
  extends:
    - .deploy-template
    - .carbon-deploy
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/carbon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/carbon/g" .env

deploy:gold:
  extends:
    - .deploy-template
    - .gold-deploy
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/gold-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/gold/g" .env

deploy:iron:
  extends:
    - .deploy-template
    - .iron-deploy
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/iron-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/iron/g" .env

deploy:neon:
  extends:
    - .deploy-template
    - .neon-deploy
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/neon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/neon/g" .env

deploy:oxygen:
  extends:
    - .deploy-template
    - .oxygen-deploy
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/oxygen-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/oxygen/g" .env

deploy:int:
  extends: .deploy-template
  tags: ["emss-coda-int"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  environment:
    name: integration
    url: https://coda-int.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT
  only:
    - int
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/coda-int/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/int/g" .env

deploy:prod:
  extends: .deploy-template
  tags: ["emss-coda-prod"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
    - { job: "test", artifacts: false }
    - { job: "project-check", artifacts: false }
    # - { job: "phpcs-security-audit-sast", artifacts: false }
    # - { job: "nodejs-scan-sast", artifacts: false }
    - { job: "semgrep-sast", artifacts: false }
    - { job: "dependency-check", artifacts: false }
  environment:
    name: production
    url: https://coda.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD
  when: manual
  only:
    - prod
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/coda/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/prod/g" .env

restart-apiv1:prod:
  stage: stageless
  tags: ["emss-coda-prod"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD
  when: manual
  # only:
  #   - prod
  script:
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - sudo docker stats --no-stream
    - cd /opt/coda
    - sudo docker compose restart apiv1
    - sleep 5
    - sudo docker stats --no-stream

stats:prod:
  stage: stageless
  tags: ["emss-coda-prod"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD
  when: manual
  # only:
  #   - prod
  script:
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - sudo docker stats --no-stream
    - cd /opt/coda
    - sudo docker compose exec apiv1 lsof -p $(pgrep -n node) | wc -l
    - sudo docker compose exec apiv1 lsof -p $(pgrep -n node)

networks:int:
  stage: stageless
  tags: ["emss-coda-int"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT
  when: manual
  # only:
  #   - prod
  script:
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - |
      for id in $(sudo docker network ls -q); do
        sudo docker network inspect "$id";
      done

.db-export-template:
  needs: []
  # I don't think we want to do this, because I don't think we want GitLab to consider this a
  # deployment. It's just grabbing some data off of Production.
  # environment:
  #   name: production
  #   url: https://coda.fit.nasa.gov
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/coda
    - sudo docker compose exec database pg_dump -U postgres coda > "${PROJECT_DIR}/coda.sql"
  artifacts:
    paths:
      - coda.sql
    expire_in: 1 day

z:db-export:prod:
  extends: .db-export-template
  # when: always
  tags: ["emss-coda-prod"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD #CI/CD Variable

z:db-export:int:
  extends: .db-export-template
  tags: ["emss-coda-int"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT #CI/CD Variable

z:db-export:carbon:
  extends:
    - .db-export-template
    - .carbon-access

z:db-export:gold:
  extends:
    - .db-export-template
    - .gold-access

z:db-export:iron:
  extends:
    - .db-export-template
    - .iron-access

z:db-export:neon:
  extends:
    - .db-export-template
    - .neon-access

z:db-export:oxygen:
  extends:
    - .db-export-template
    - .oxygen-access

.db-import-template:
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/coda
    - cp "${PROJECT_DIR}/coda.sql" /d1/coda/db-init/coda.sql

    # Stop docker compose, then remove database files
    - sudo /usr/bin/docker compose down --remove-orphans
    - sudo rm -rf /d1/coda/postgres

    # Bring docker compose back up, which will use the file at /d1/coda/db-init/coda.sql, then remove it
    - sudo /usr/bin/docker compose up -d
    - sudo rm -f /d1/coda/db-init/coda.sql

    # Migrations will be run when the apiv1 container restarts

z:db-import:carbon:
  extends:
    - .db-import-template
    - .carbon-deploy
  needs: ["z:db-export:prod"]

z:db-import:gold:
  extends:
    - .db-import-template
    - .gold-deploy
  needs: ["z:db-export:prod"]

z:db-import:iron:
  extends:
    - .db-import-template
    - .iron-deploy
  needs: ["z:db-export:prod"]

z:db-import:neon:
  extends:
    - .db-import-template
    - .neon-deploy
  needs: ["z:db-export:prod"]

z:db-import:oxygen:
  extends:
    - .db-import-template
    - .oxygen-deploy
  needs: ["z:db-export:prod"]

z:db-import:int:
  extends: .db-import-template
  tags: ["emss-coda-int"]
  needs: ["z:db-export:prod"]
  environment:
    name: integration
    url: $URL
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT #CI/CD Variable
    URL: https://coda-int.fit.nasa.gov

.container-logs-template:
  when: manual
  needs: []
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # Start with a trivial sudo command to record the sudo password session
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile

    # OS info and partition usage
    - cat /etc/os-release
    - df -h

    # Setup artifact directories
    - LOG_ARTIFACTS=$(pwd)/log_artifacts
    - mkdir -p "${LOG_ARTIFACTS}"

    - cd /opt/coda

    # Print the last 100 lines of logs to the GitLab job log
    - sudo docker compose logs apiv1 --tail 100
    - sudo docker compose logs nginx --tail 100

    # Put the full logs into artifacts. Full logs may hit the job log length
    # limit, and generally make the job log unreadably long
    - sudo docker compose logs apiv1 > "${LOG_ARTIFACTS}/apiv1"
    - sudo docker compose logs nginx > "${LOG_ARTIFACTS}/nginx"

    - sudo journalctl --unit=rsyslog -n 200 --no-pager
  artifacts:
    when: always
    paths:
      - ./log_artifacts
    expire_in: 1 day

z:logs:carbon:
  extends:
    - .container-logs-template
    - .carbon-access

z:logs:gold:
  extends:
    - .container-logs-template
    - .gold-access

z:logs:iron:
  extends:
    - .container-logs-template
    - .iron-access

z:logs:neon:
  extends:
    - .container-logs-template
    - .neon-access

z:logs:oxygen:
  extends:
    - .container-logs-template
    - .oxygen-access

z-logs:int:
  extends: .container-logs-template
  tags: ["emss-coda-int"]
  needs: []
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT

z-logs:prod:
  extends: .container-logs-template
  tags: ["emss-coda-prod"]
  needs: []
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD
