# README
# This defines the pipeline of jobs that runs when you push to gitlab
# To check the validity of this file, try the live editor:
# https://gitlab.fit.nasa.gov/coda/coda/-/ci/lint

variables:
  # Images are pulled via GitLab dependency proxy (caches from Docker Hub)
  # Kaniko uses the dependency proxy as a registry mirror for rate limiting and caching
  KANIKO_REGISTRY_MIRROR: "${CI_SERVER_HOST}/emss/dependency_proxy/containers"

# Default node image unless otherwise specified
image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24.11.1-alpine3.23"

include:
  # A11y tests. Disabled for now.
  # - template: "Verify/Accessibility.gitlab-ci.yml"

  # There are more jobs included at the top level .gitlab-ci.yml

  - project: "emss/gitlab-templates"
    ref: 2.7.1
    file:
      # Run standard FIT developer-ecosystem/ci-job-templates with emss
      # stageless overrides.
      # <https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates>
      - "/jobs/fit-ecosystem.gitlab-ci.yml"

      # Code quality checks
      - "/jobs/code-quality.gitlab-ci.yml"

      # Fitdock deploy template
      - "/jobs/fitdock-deploy.gitlab-ci.yml"

      # Kaniko build template
      - "/jobs/kaniko-build.gitlab-ci.yml"

      # Retag job template
      - "/jobs/container-retag.gitlab-ci.yml"

  # Adds jobs to export db, and dump logs
  - local: .gitlab/includes/server-jobs.yml
  - local: .gitlab/includes/db-import.yml

# Override some properties on FIT jobs.
# yaml-lint, project-check, dependency-check are set to manual: they depend on
# fit-ecosystem.gitlab-ci.yml include above (eegitlabregistry images inaccessible)
yaml-lint:
  stage: stageless
  needs: []
  when: manual
  script:
    - CONFIG_FILES=".yamllint .yamllint.yaml .yamllint.yml"
    - CONFIG_FILE=""
    - |
      for filename in $CONFIG_FILES; do
        if [ -e "$filename" ]; then
          CONFIG_FILE="$filename"
          break
        fi
      done
    - |
      if [ -z "${CONFIG_FILE}" ]; then
        yamllint -d relaxed .
      else
        yamllint -c ${CONFIG_FILE} .
      fi

project-check:
  when: manual
  variables:
    SCAN_FOR_DOCS: "no"
    ALLOWED_FILES: >
      src/packages

dependency-check:
  stage: stageless
  when: manual
  tags: ["docker", "linux"] # can't use openshift (yet?)
  needs: ["install_dependencies"] # dependency-check takes a while, don't wait for "test" job
  rules:
    - if: '$CI_COMMIT_BRANCH == "int" || $CI_COMMIT_BRANCH == "prod"'
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar

code_quality:
  when: manual

npm-audit:
  stage: stageless
  image: ${CI_REGISTRY}/emss/docker-images/node-ci:npm-audit # custom image, not on Docker Hub
  when: manual
  needs: []
  tags: ["openshift"]
  allow_failure: true
  script:
    # Run this without --json to make a pretty-print for the job log, plus will pass/fail the job
    - npm audit

install_dependencies:
  stage: stageless
  # This could be openshift, but it runs faster in a VM; other jobs rely on it, so get it done ASAP
  tags: ["docker", "linux"]
  cache:
    # Cache npm's package download cache, keyed on package-lock.json so it only invalidates when deps change.
    # `npm ci` still wipes node_modules and reinstalls, but tarballs come from .npm/ instead of the registry.
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    # Tar node_modules into a single artifact. GitLab spends most of the upload time walking 50k+ files
    # and adding each to the artifact zip; collapsing to one tarball cuts upload from ~22s to a few seconds,
    # and dependent jobs see the same speedup on download/extract.
    - tar -cf node_modules.tar node_modules
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules.tar

#
# Creates Software Bill of Materials
#
node-sbom:
  stage: stageless
  tags: ["docker", "linux"] # Can't be openshift due to it not pulling latest tag
  needs: ["install_dependencies"]
  image: ${CI_REGISTRY}/emss/docker-images/node-ci:sbom # custom image, not on Docker Hub
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
  script:
    - /make-sbom.sh
  artifacts:
    when: always
    paths:
      - "./bom.json"
      - "./BOM.md"
    expire_in: 1 day

.make-dotenv-template:
  stage: stageless
  needs: []
  tags: ["docker", "linux"] # needs to do global install, so needs to be root
  before_script:
    # Determine the versions of @emss/make-dotenv and tsx defined in package-lock.json
    # This allows us to be sure the same versions are used in CI as are used in local dev
    - MAKE_DOTENV_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@emss/make-dotenv'].version")
    - TSX_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/tsx'].version")

    # Globally install these packages. This allows us to use them without installing
    # all packages specified in package.json, which takes 1-4 minutes depending on the
    # repository.
    #
    # Other options:
    #   1. We could make this job have `needs: ['install_dependencies']`, but that means
    #      this job would be delayed running 1-4 minutes, which then delays container
    #      builds 1-4 minutes.
    #   2. We could have the emss/packages build a make-dotenv docker image tagged by its
    #      version number, and then this job could run using that image by specifying
    #      `image: ${CI_REGISTRY}/emss/packages/make-dotenv:x.y.z`. That would save some
    #      time since we wouldn't need to install global packages each time, but the job
    #      as-written runs in about 10 seconds, so we wouldn't be saving much. We would
    #      be causing ourselves some problems, though, since we'd have a version of
    #      @emss/make-dotenv specified in package(-lock).json, and then we'd have another
    #      version specified on the docker image on this job. We'd have to be careful to
    #      keep the two in sync. The current job as-written seems simpler and good enough.
    - npm i -g "@emss/make-dotenv@${MAKE_DOTENV_VERSION}" --userconfig ./.npmrc
    - npm i -g "tsx@${TSX_VERSION}"
  script:
    # Copy contents of DOTENV_SECRET from CI/CD variables to a new .env.secret file
    - echo "${DOTENV_SECRET_TS}" > ./env.secret.ts

    # Determine which docker image type (dev, int, or prod) to deploy based on branch
    # Append the commit sha in order to ensure the correct build is being deployed in the case
    # multiple devs are building images simultaneously
    - >
      if [ "${CI_COMMIT_REF_SLUG}" == "prod" ]; then
        IMAGE_VERSION="prod-${CI_COMMIT_SHORT_SHA}"
      elif [ "${CI_COMMIT_REF_SLUG}" == "int" ]; then
        IMAGE_VERSION="int-${CI_COMMIT_SHORT_SHA}"
      else
        IMAGE_VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      fi

    # Save image version into a an artifact to be read later in other jobs
    - echo "IMAGE_VERSION=${IMAGE_VERSION}" >> pipelineVariables.env
    # Export the variable so it can be read inside the make-dotenv
    - export IMAGE_VERSION

    - make-dotenv ${MAKE_DOTENV_ENVIRONMENT}
    # Extract DOCKER_IMAGE_DATABASE from .env and export it without quotes for GitLab CI services
    # GitLab services are initialized before before_script, so we need the variable in dotenv artifact
    - source .env
    - echo "DOCKER_IMAGE_DATABASE=${DOCKER_IMAGE_DATABASE//\"/}" >> pipelineVariables.env
  artifacts:
    reports:
      dotenv:
        - pipelineVariables.env
    paths:
      - .env
    expire_in: 1 day

make-dotenv:fit:
  extends: .make-dotenv-template
  variables:
    MAKE_DOTENV_ENVIRONMENT: fit

make-dotenv:prod:
  extends: .make-dotenv-template
  variables:
    MAKE_DOTENV_ENVIRONMENT: prod

make-dotenv:test:
  extends: .make-dotenv-template
  variables:
    MAKE_DOTENV_ENVIRONMENT: test

# Lint and tsc split into three parallel jobs. OpenShift has plenty of
# runners (~100), so wall-clock is faster as separate jobs than chaining
# them together. No DB needed for any of them.
lint-js:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
  before_script:
    - tar -xf node_modules.tar
  script:
    - npm run lint:js

lint-css:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
  before_script:
    - tar -xf node_modules.tar
  script:
    - npm run lint:css

tsc:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
  before_script:
    - tar -xf node_modules.tar
  script:
    - npm run tsc

test-vitest:
  stage: stageless
  needs:
    - install_dependencies
    - make-dotenv:test
  parallel:
    matrix:
      - SHARD_INDEX: 1
      - SHARD_INDEX: 2
      - SHARD_INDEX: 3
  variables:
    NUM_SHARDS: 3
    # define variables used by Node app
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_NAME: coda

    # plug those same variables into the Postgres container we're spinning up
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: coda
  services:
    # image should match database used in docker-compose.yml
    # DOCKER_IMAGE_DATABASE comes from pipelineVariables.env dotenv artifact (without quotes)
    # Using dependency proxy for caching and rate limiting
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${DOCKER_IMAGE_DATABASE}
      alias: postgres-test-container
      variables:
        # OpenShift runs containers as a random non-root UID. The default
        # PGDATA (/var/lib/postgresql/data) is owned by the postgres user
        # (UID 70 on alpine) and not writable by an arbitrary UID, so initdb
        # fails silently and postgres never starts. Redirecting PGDATA to
        # /tmp lets initdb create the data directory regardless of UID.
        PGDATA: /tmp/pgdata
  tags: ["openshift"]
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
    # Remove lines from .env file.
    - sed -i '/DB_PASS/d' .env
    - sed -i '/DB_HOST/d' .env
    - sed -i '/DB_NAME/d' .env
  script:
    - echo "Running vitest shard ${SHARD_INDEX} of ${NUM_SHARDS}"
    - npm run migration:up
    # Each shard writes a blob report (.vitest-reports/blob-*.json) plus the
    # default reporter for the job log. The merge-coverage job below combines
    # all blobs into a single coverage report.
    - npx vitest run --config vitest.config.mts --coverage --shard=${SHARD_INDEX}/${NUM_SHARDS} --reporter=blob --reporter=default
  artifacts:
    when: always
    paths:
      - .vitest-reports/
    expire_in: 1 day

# Merge per-shard blob reports into a single coverage report.
# Uses vitest 4's built-in --merge-reports --coverage workflow.
test-vitest-merge-coverage:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
    - test-vitest
  before_script:
    - tar -xf node_modules.tar
  script:
    - npx vitest --config vitest.config.mts --merge-reports --coverage --reporter=junit --reporter=default
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - ./coverage/*
    expire_in: 1 day

# Forward-compat smoke test against the next version of node that CODA may use.
# Manual-only — it's allow_failure, doesn't gate deploys, and runs the whole
# lint/tsc/build/test chain serially. Trigger it when bumping the node version.
test-node-next:
  stage: stageless
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:25.8.1-alpine
  needs:
    - install_dependencies
    - make-dotenv:test
  variables:
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_NAME: coda
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: coda
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${DOCKER_IMAGE_DATABASE}
      alias: postgres-test-container
      variables:
        PGDATA: /tmp/pgdata
  tags: ["openshift"]
  when: manual
  allow_failure: true
  before_script:
    - tar -xf node_modules.tar
    - sed -i '/DB_PASS/d' .env
    - sed -i '/DB_HOST/d' .env
    - sed -i '/DB_NAME/d' .env
  script:
    - npm run migration:up
    - npm run lint
    - npm run tsc
    - npm run build
    - npm run test

#
# Build container images
# Vite is not used in production, so we don't need to build it
#

# This build template uses a hard coded pattern path to find the Dockerfile for each service
.kaniko-build-template:
  extends: .emss-kaniko-build # use job template from gitlab-templates repo
  stage: stageless
  tags: ["docker", "linux"]
  needs:
    - make-dotenv:fit
  before_script:
    # required for containers to have NASA CA cert
    - echo "${ENV_LOCAL_CERT_PEM}" > ./.env.local.cert.pem

#
# Build docker images immediately
# SERVICE_NAME = name of service from docker-compose.yml (key in services object)
#
docker:build:nginx:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nginx
    MULTISTAGE_TARGET: prod
    GIT_COMMIT: ${CI_COMMIT_SHORT_SHA}
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      VITE_PUBLIC_MAPBOX_KEY
      VITE_PUBLIC_TALKYBOT_URL
      VITE_PUBLIC_LIVE_STREAMS_ENABLED
      VITE_PUBLIC_MEDIA_MTX_CONTROL_URL
      VITE_PUBLIC_MEDIA_MTX_HLS_URL
      VITE_PUBLIC_MEDIA_MTX_RECORDINGS_URL
      VITE_PUBLIC_MTX_VIDEO_MAX_AGE_DAYS
      VITE_PUBLIC_MAPLIBRE_BASE_URL
      VITE_PUBLIC_MAPLIBRE_PMTILES_FILENAME
      GIT_COMMIT

docker:build:apiv1:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: apiv1
    MULTISTAGE_TARGET: prod
    GIT_COMMIT: ${CI_COMMIT_SHORT_SHA}
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      GIT_COMMIT

#
# Retag docker images after necessary jobs pass (e.g. unit testing passes).
# Used by int/prod deploys — requires tests to pass.
#
docker:retag:
  extends: .emss-container-retag
  needs:
    - make-dotenv:fit
    - job: lint-js
      artifacts: false
    - job: lint-css
      artifacts: false
    - job: tsc
      artifacts: false
    - job: test-vitest
      artifacts: false
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      apiv1

# Retag for dev environments — does NOT require tests to pass.
# Lets dev deploys proceed immediately after builds complete.
docker:retag:dev:
  extends: .emss-container-retag
  needs:
    - make-dotenv:fit
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      apiv1

deploy:artifactize-committed-files:
  image: "${CI_REGISTRY}/emss/docker-images:envsubst-bash-in-envsubst"
  stage: stageless
  needs: []
  tags: ["openshift"]
  script:
    - echo "This job runs no commands, just turns .fitdock.yml and docker-compose.yml into artifacts"
  artifacts:
    paths:
      - .fitdock.yml
      - docker-compose.yml
      - scripts/upgrade-db.sh
    expire_in: 1 day

# Used by int/prod — requires tests to pass (via docker:retag)
.deploy-template:
  extends: .emss-fitdock-deploy # use job template from gitlab-templates repo
  needs:
    - make-dotenv:fit
    - docker:retag
    - deploy:artifactize-committed-files
  stage: stageless
  timeout: 10 minutes

# Used by dev envs — does NOT require tests to pass (via docker:retag:dev)
.deploy-template:dev:
  extends: .emss-fitdock-deploy
  needs:
    - make-dotenv:fit
    - docker:retag:dev
    - deploy:artifactize-committed-files
  stage: stageless
  timeout: 10 minutes

deploy:carbon:
  extends:
    - .deploy-template:dev
    - .carbon-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/carbon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/carbon/g" .env

deploy:gold:
  extends:
    - .deploy-template:dev
    - .gold-deploy
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/gold-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/gold/g" .env

deploy:iron:
  extends:
    - .deploy-template:dev
    - .iron-deploy
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/iron-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/iron/g" .env

deploy:neon:
  extends:
    - .deploy-template:dev
    - .neon-deploy
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/neon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/neon/g" .env

deploy:oxygen:
  extends:
    - .deploy-template:dev
    - .oxygen-deploy
  when: manual
  before_script:
    - sed -i "s/INSERT_SUBDOMAIN/oxygen-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/oxygen/g" .env

deploy:int:
  extends: .deploy-template
  tags: ["emss-coda-int"]
  resource_group: int # prevents concurrent executions on this environment when there are multiple pipelines
  environment:
    name: integration
    url: https://coda-int.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_INT}
  only:
    - int
  before_script:
    # Run DB upgrade script if needed
    - chmod +x ./scripts/upgrade-db.sh
    - ./scripts/upgrade-db.sh
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/coda-int/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/int/g" .env

deploy:prod:
  extends: .deploy-template
  tags: ["emss-coda-prod"]
  resource_group: prod # prevents concurrent executions on this environment when there are multiple pipelines
  environment:
    name: production
    url: https://coda.fit.nasa.gov
  needs:
    - make-dotenv:prod
    - docker:retag
    - deploy:artifactize-committed-files
    - z:db-export:prod
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_PROD}
  when: manual
  only:
    - prod
  before_script:
    # Run DB upgrade script if needed
    - chmod +x ./scripts/upgrade-db.sh
    - ./scripts/upgrade-db.sh
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/coda/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/prod/g" .env
