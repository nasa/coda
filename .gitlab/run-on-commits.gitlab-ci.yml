include:
  # Fitdock deploy template
  - project: "emss/gitlab-templates"
    ref: main
    file: "/jobs/fitdock-deploy.gitlab-ci.yml"

  # Kaniko build template
  - project: "emss/gitlab-templates"
    ref: main
    file: "/jobs/kaniko-build.gitlab-ci.yml"

.kaniko-build-template:
  extends: .emss-kaniko-build # use job template from gitlab-templates repo
  stage: stageless
  needs:
    - make-dotenv
  before_script:
    # required for nextjs to have NASA CA cert
    - echo "${ENV_LOCAL_CERT_PEM}" > ./.env.local.cert.pem

#
# Build docker images immediately (needs: [], meaning it has not prerequisites)
# so longer jobs get started soon. Don't push them until the docker:push:* jobs
# below, which wait for validation (unit testing, etc)
#
# SERVICE_NAME = name of service from docker-compose.yml (key in services object)
#
docker:build:nginx:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nginx
    MULTISTAGE_TARGET: base
    NGINX_BASE_IMAGE: eegitlabregistry.fit.nasa.gov/emss/docker-images/nginx:1.23.0-alpine
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      NGINX_BASE_IMAGE

docker:build:nextjs:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nextjs
    MULTISTAGE_TARGET: prod
    NEXTJS_BASE_IMAGE: $CURRENT_NODE_VERSION_IMAGE
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      NEXT_PUBLIC_MAPBOX_KEY
      NEXT_PUBLIC_APP_ENV
      IMAGE_VERSION
      NEXTJS_BASE_IMAGE

#
# Retag docker images after necessary jobs pass (e.g. unit testing passes)
#
docker:retag:
  stage: stageless
  image: "$CI_REGISTRY/emss/docker-images:skopeo"
  variables:
    GIT_STRATEGY: none # Don't checkout the repo, just get artifacts
  tags: ["docker", "linux"]
  needs:
    - make-dotenv
    - job: test
      artifacts: false
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:nextjs
      artifacts: false
  script:
    # Login to registry
    - echo $CI_JOB_TOKEN | skopeo login -u gitlab-ci-token --password-stdin $CI_REGISTRY

    # Get the same value as IMAGE_VERSION var in .env, but without having to parse .env.
    # See make-dotenv job/template.
    - set -o allexport && source ./.env && set +o allexport

    - SERVICE=nginx
    - TEMP_IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:preview-${IMAGE_VERSION}"
    - FINAL_IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:${IMAGE_VERSION}"
    - skopeo copy "docker://${TEMP_IMAGE}" "docker://${FINAL_IMAGE}"

    - SERVICE=nextjs
    - TEMP_IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:preview-${IMAGE_VERSION}"
    - FINAL_IMAGE="${CI_REGISTRY_IMAGE}/${SERVICE}:${IMAGE_VERSION}"
    - skopeo copy docker://$TEMP_IMAGE docker://$FINAL_IMAGE

deploy:artifactize-committed-files:
  image: "$CI_REGISTRY/emss/docker-images:envsubst-bash-in-envsubst"
  stage: stageless
  needs: []
  tags: ["openshift"]
  script:
    - echo "This job runs no commands, just turns .fitdock.yml and docker-compose.yml into artifacts"
  artifacts:
    paths:
      - .fitdock.yml
      - docker-compose.yml

.docker-deploy-template:
  extends: .emss-fitdock-deploy # use job template from gitlab-templates repo

deploy:dev1:
  extends: .docker-deploy-template
  tags: ["coda-dev1-runner"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  environment:
    name: development1
    url: https://coda-dev.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_DEV1
  when: manual

deploy:dev2:
  extends: .docker-deploy-template
  tags: ["coda-dev2-runner"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  environment:
    name: development2
    url: https://coda-dev2.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_DEV2
  when: manual

deploy:int:
  extends: .docker-deploy-template
  tags: ["coda-int-runner"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  environment:
    name: integration
    url: https://coda-int.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT
  only:
    - int

deploy:prod:
  extends: .docker-deploy-template
  tags: ["coda-prod-runner"]
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
    - { job: "test", artifacts: false }
    - { job: "project-check", artifacts: false }
    - { job: "phpcs-security-audit-sast", artifacts: false }
    - { job: "nodejs-scan-sast", artifacts: false }
    - { job: "semgrep-sast", artifacts: false }
    - { job: "dependency-check", artifacts: false }
  environment:
    name: production
    url: https://coda.fit.nasa.gov
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD
  when: manual
  only:
    - prod
