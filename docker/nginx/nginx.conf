user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All EMSS Nginx log_format must be this format, to be ingested properly by
    # emss/logs logstash
    log_format main '$remote_addr $http_x_forwarded_for "$remote_user" $email [$time_local] "$host" '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    proxy_connect_timeout       28800;
    proxy_send_timeout          28800;
    proxy_read_timeout          28800;
    send_timeout                28800;

    #gzip  on;

    server {

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name  codanginx;

        ssl_certificate      /etc/pki/tls/certs/nginx.crt;
        ssl_certificate_key  /etc/pki/tls/private/nginx.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 50G;

        root /usr/share/nginx/html;

        include setup-auth-unified.conf;

        # Named location referenced by `error_page 401 = @error401` in
        # route-require-auth.conf. Kicks off the OIDC dance via the shared
        # oauth2-proxy on emss-labs and tells it where to send the browser after
        # the callback (the original CODA URL).
        #
        # We use /oauth2/start (not /oauth2/sign_in) because
        # OAUTH2_PROXY_SKIP_PROVIDER_BUTTON is true on the shared proxy, so
        # there's no interstitial sign-in page to render — go straight to
        # LaunchPad.
        #
        # The original URL is passed via the X-Auth-Request-Redirect *header*
        # rather than an `rd=` query parameter. This matters when the URL has
        # unencoded `&` in it (e.g. /view/?date=...&gmt=...&s=0&...): Go's
        # net/http query parser on the oauth2-proxy side splits on `&` and
        # truncates `rd` at the first `&`, so the state encoded into the
        # LaunchPad redirect ends up being a truncated URL and the user lands
        # on the wrong page after callback. Headers are not query-string
        # parsed, so the full URL survives intact.
        #
        # oauth2-proxy's appDirector checks `rd` first, then
        # `X-Auth-Request-Redirect` — using the header is the no-extra-modules
        # fix (stock nginx has no urlencode primitive for $request_uri).
        #
        # NOTE: inside a *named* location, `proxy_pass` is not allowed to have
        # a URI part (nginx emits "proxy_pass cannot have URI part in location
        # given by regular expression, or inside named location" and refuses
        # to start). We use `rewrite ... break` to set the request URI to
        # /unified-auth/oauth2/start, then proxy_pass with a host-only URL so
        # nginx forwards the rewritten URI to the upstream.
        #
        # The trailing `?` on the rewrite target strips the original query
        # string ($args) so it isn't carried into the request to /oauth2/start.
        # Without it, the user's app-level query params (date=..., gmt=..., dv=...)
        # would be forwarded to oauth2-proxy, which would then pass any that
        # match its configured loginURLParameterOverrides allow rules through
        # to the IdP login URL as extra OIDC params. Even if none of them
        # match, forwarding the random characters (parens, colons, commas) is
        # noisy and risks tickling IdP-side parser bugs. The original URL is
        # still preserved intact in the X-Auth-Request-Redirect header below.
        location @error401 {
            rewrite ^ /unified-auth/oauth2/start? break;
            proxy_pass            https://emss-labs.fit.nasa.gov;
            proxy_ssl_server_name on;
            proxy_set_header      Host                    emss-labs.fit.nasa.gov;
            proxy_set_header      X-Real-IP               $remote_addr;
            proxy_set_header      X-Scheme                $scheme;
            proxy_set_header      X-Auth-Request-Redirect $scheme://$http_host$request_uri;
            proxy_set_header      Content-Length          "";
            proxy_pass_request_body off;
        }

        location / {
            include route-require-auth.conf;
            try_files $uri $uri/ /index.html;  # Rewrite all requests to index.html
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires max;
            log_not_found off;
        }

        #
        # Serve API container
        #

        # Put the user endpoint behind auth so we can get the user data from the auth system
        location /api/v1/user/current {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/user/current;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect the emss/dataView and emss/dataRefresh endpoints since they require superuser
        location /api/v1/emss {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/emss;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Allow ephemeris sync from other CODA instances — auth handled by x-api-key in the app
        location /api/v1/db/ephemeris/recent {
            proxy_pass http://apiv1:3001/api/v1/db/ephemeris/recent;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/db endpoints since many require superuser (ephemeris, gps, photos, etc.)
        location /api/v1/db {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/db;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/profiler endpoints since they require superuser
        location /api/v1/profiler {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/profiler;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/restricted endpoints. These deliver auth-gated media override
        # data to specific AUIDs (see RESTRICTED_OVERRIDES.md). Auth is enforced both
        # here at the nginx boundary AND in the Express handler via getUser(req).
        location /api/v1/restricted {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/restricted;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Server-to-server proxy that fetches restricted Talkybot audio using the
        # shared EMSS_TOKEN and streams it back to the CODA browser. Must be
        # launchpad-authed at the edge so unauthenticated callers can't use CODA
        # as an open relay for Talkybot audio. proxy_buffering off preserves
        # Range / 206 streaming semantics for the <audio> element.
        location /api/v1/external/audiofiles {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/external/audiofiles;
            proxy_redirect off;
            proxy_buffering off;
        }

        #
        # Serve API container. Allow all traffic because auth will be handled
        # internally by the API if we ever implement auth in CODA
        #
        location /api/v1/ {
            proxy_pass http://apiv1:3001/api/v1/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # mediamtx server reverse proxy ports
        # location /live/ {
        #     proxy_pass http://host.docker.internal:8888/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

        # location /api/ {
        #     proxy_pass http://host.docker.internal:9997/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

        # location /recordings/ {
        #     proxy_pass http://host.docker.internal:9996/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

    }
}
