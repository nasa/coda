user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All EMSS Nginx log_format must be this format, to be ingested properly by
    # emss/logs logstash
    log_format main '$remote_addr $http_x_forwarded_for "$remote_user" $email [$time_local] "$host" '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    proxy_connect_timeout       28800;
    proxy_send_timeout          28800;
    proxy_read_timeout          28800;
    send_timeout                28800;

    #gzip  on;

    server {

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name  codanginx;

        ssl_certificate      /etc/pki/tls/certs/nginx.crt;
        ssl_certificate_key  /etc/pki/tls/private/nginx.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 50G;

        root /usr/share/nginx/html;

        include setup-auth-unified.conf;

        # Named location referenced by `error_page 401 = @error401` in
        # route-require-auth.conf. Passes the original URI as the `rd` query
        # parameter so oauth2-proxy encodes it into the LaunchPad state and
        # redirects the browser back to the correct CODA URL after login.
        location @error401 {
            return 302 /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
        }

        location / {
            include route-require-auth.conf;
            try_files $uri $uri/ /index.html;  # Rewrite all requests to index.html
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires max;
            log_not_found off;
        }

        #
        # Serve API container
        #

        # Put the user endpoint behind auth so we can get the user data from the auth system
        location /api/v1/user/current {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/user/current;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect the emss/dataView and emss/dataRefresh endpoints since they require superuser
        location /api/v1/emss {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/emss;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Allow ephemeris sync from other CODA instances — auth handled by x-api-key in the app
        location /api/v1/db/ephemeris/recent {
            proxy_pass http://apiv1:3001/api/v1/db/ephemeris/recent;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/db endpoints since many require superuser (ephemeris, gps, photos, etc.)
        location /api/v1/db {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/db;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/profiler endpoints since they require superuser
        location /api/v1/profiler {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/profiler;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Protect /api/v1/restricted endpoints. These deliver auth-gated media override
        # data to specific AUIDs (see RESTRICTED_OVERRIDES.md). Auth is enforced both
        # here at the nginx boundary AND in the Express handler via getUser(req).
        location /api/v1/restricted {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/restricted;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Server-to-server proxy that fetches restricted Talkybot audio using the
        # shared EMSS_TOKEN and streams it back to the CODA browser. Must be
        # launchpad-authed at the edge so unauthenticated callers can't use CODA
        # as an open relay for Talkybot audio. proxy_buffering off preserves
        # Range / 206 streaming semantics for the <audio> element.
        location /api/v1/external/audiofiles {
            include route-require-auth.conf;

            proxy_pass http://apiv1:3001/api/v1/external/audiofiles;
            proxy_redirect off;
            proxy_buffering off;
        }

        #
        # Serve API container. Allow all traffic because auth will be handled
        # internally by the API if we ever implement auth in CODA
        #
        location /api/v1/ {
            proxy_pass http://apiv1:3001/api/v1/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # mediamtx server reverse proxy ports
        # location /live/ {
        #     proxy_pass http://host.docker.internal:8888/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

        # location /api/ {
        #     proxy_pass http://host.docker.internal:9997/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

        # location /recordings/ {
        #     proxy_pass http://host.docker.internal:9996/;
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

    }
}
