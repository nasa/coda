# This is done because LaunchPad is configured to only allow
# /api/v1/auth/nasalp/adfs/oidc/login as the redirect URL. So here
# we pass those requests directly to /oauth2/callback
location = /api/v1/auth/nasalp/adfs/oidc/login {
    # rewrite /api/v1/auth/nasalp/adfs/oidc/login(.*) $1 break;
    proxy_pass http://oauth2-proxy:4180/oauth2/callback;
}

# Both /oauth2/ and /oauth2/auth blocks below, see:
# https://oauth2-proxy.github.io/oauth2-proxy/docs/configuration/overview#configuring-for-use-with-the-nginx-auth_request-directive
location /oauth2/ {
    proxy_pass       http://oauth2-proxy:4180;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Scheme                $scheme;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    # or, if you are handling multiple domains:
    # proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
}
location = /oauth2/auth {
    proxy_pass       http://oauth2-proxy:4180;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Scheme         $scheme;
    # nginx auth_request includes headers but not body
    proxy_set_header Content-Length   "";
    proxy_pass_request_body           off;
}

# same as the /oauth2/ block above but removes the X-Auth-Request-Redirect to the
# $request_uri, since we want to redirect to the auth provider's logout URL instead so
# we logout locally and on the auth provider. If X-Auth-Request-Redirect is included here,
# then the redirect requests conflict in some way, causing infinite redirects.
location = /logout {
    proxy_pass       http://oauth2-proxy:4180/oauth2/sign_out;
    proxy_intercept_errors on;

    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Scheme                $scheme;

    # The config above tends to get in an infinite redirect loop. Catch that and send to
    # logout page
    error_page
        301 302 303 304 307 308
        400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
        500 501 502 503 504 505 507
        =200
        /loggedout;
}

location = /login {
    include route-require-auth.conf;
    alias /usr/share/nginx/html/;
    try_files /loggedin.html =404;
}

# Responds 202 Accepted (with emtpy content) or 401 Unauthorized (with /loggedout content)
location = /is-logged-in {
    proxy_pass http://oauth2-proxy:4180/oauth2/auth;
    proxy_intercept_errors on;

    # Handling 401 Unauthorized response (expected if not logged in), or any other bad response
    error_page
        301 302 303 304 307 308
        400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429
        500 501 502 503 504 505 507
        /loggedout;
}

location = /loggedout {
    alias /usr/share/nginx/html/;
    try_files /loggedout.html =404;
}
