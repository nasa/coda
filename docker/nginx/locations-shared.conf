# Shared location blocks for the static/SPA-serving parts of the CODA
# nginx config. Included by both the TLS-on-:443 server block (the existing
# single-app deploy) and the plain-HTTP-on-:8080 server block (the imago
# preview-deploy edge target — see imago/docs/proxy-design.md §5 and §9.1).
#
# Auth handling differs between the two server blocks and is therefore NOT
# included here:
# - The :443 block uses route-require-auth.conf inside its `location /`
#   to require Launchpad auth on every page load.
# - The :8080 block has no auth — imago's Traefik runs ForwardAuth to the
#   shared oauth2-proxy at the edge, before any request reaches this nginx.

location / {
    try_files $uri $uri/ /index.html;  # Rewrite all requests to index.html
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    expires max;
    log_not_found off;
}
