# Header translation for the imago :8080 plain-HTTP listener.
#
# Under imago, Traefik's ForwardAuth middleware forwards oauth2-proxy's
# X-Auth-Request-* headers (per imago/docs/proxy-design.md §5.6) to this
# nginx. apiv1 reads X-User / X-Email / X-Access-Token (the latter via
# case-sensitive rawHeaders scan in @emss/oauth2-proxy-backend), so we
# rename them here.
#
# Include this in every proxy-pass location inside the :8080 server block.
# Cannot be hoisted to server scope because any location that declares its
# own `proxy_set_header` loses inherited ones (nginx "array directive"
# inheritance rule).
proxy_set_header X-User         $http_x_auth_request_user;
proxy_set_header X-Email        $http_x_auth_request_email;
proxy_set_header X-Access-Token $http_x_auth_request_access_token;
