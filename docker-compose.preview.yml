#
# DOCKER OVERRIDE FILE:
# This is an override file. It is intended to be used on top of the base docker-compose.yml file.
#
# SUMMARY:
# Do the exact same thing as the production `docker-compose.yml`, just build locally as a way to
# quickly preview what a production build would do.
#
version: '3.9'
services:
  nginx:
    image: ${REGISTRY_IMAGE}/nginx:preview-${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
      args:
        - NGINX_BASE_IMAGE=${NGINX_BASE_IMAGE}

  nextjs:
    image: ${REGISTRY_IMAGE}/nextjs:preview-${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ./docker/nextjs/Dockerfile
      target: prod
      args:
        # Build args needed in context during build (see note in Dockerfile)
        - NEXT_PUBLIC_MAPBOX_KEY=${NEXT_PUBLIC_MAPBOX_KEY}
        - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV}
        - IMAGE_VERSION=${IMAGE_VERSION}
        - NEXTJS_BASE_IMAGE=${NEXTJS_BASE_IMAGE}

    # Uncomment these lines to enable profiling using 0x, https://www.npmjs.com/package/0x#0x
    # You'll need to run `./appcompose preview up`, then open a terminal on the apiv1 container and
    # determine what processes are running with `ps aux`, then send "SIGINT"  to the 0x process
    # with `kill -INT 31` (assuming the 0x process is ID 31). Doing so might interupt the container,
    # but this is the weird way 0x cuts new profiling sets. When you do this, a directory should be
    # created in `./.local/profiler` like `SOMETIMESTAMP-31`. Create flamegraph.html with command
    # `0x --visualize-only ./.local/profiler/$theDirectory` (you need to `npm i -g 0x` first), then
    # open the HTML file in chrome to see your flamegraph.
    #
    # These lines below create the volume to store the profiler data, so you can easily retrieve it
    # on your machine, and alter the Docker CMD line to not just do `node api.js`, but instead wrap
    # that command in the 0x profiler command.
    #
    # environment:
    #   NODE_ENV: production
    # volumes:
    #   - './.local/profiler:/app/profiler'
    # command: '/bin/sh -c "npm i -g 0x; npm i express; 0x --collect-only --output-dir profiler/{timestamp}-{pid} server.js"'
