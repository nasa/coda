# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/node/tags/
image: node:14

# This folder is cached between builds
# http://docs.gitlab.com/ee/ci/yaml/README.html#cache
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .next/cache/

before_script:
  - npm install

stages:
  - test
  - build
  - pages

test:
  script:
    - npm t

build:
  script:
    - npm run build-prod
  stage: build
  artifacts:
    paths:
      - .next

pages:
  script:
    - npm run export
    - rm -rf public
    - mv out public
  stage: deploy
  artifacts:
    paths:
      - public
  only:
    - live
