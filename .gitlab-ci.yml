# README
# This defines the pipeline of jobs that runs when you push to gitlab
# To check the validity of this file, try the live editor:
# https://gitlab.fit.nasa.gov/coda/coda/-/ci/lint

# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/node/tags/
image: node:14-alpine

# This folder is cached between builds
# http://docs.gitlab.com/ee/ci/yaml/README.html#cache
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .next/cache/

# also run standard FIT dependency and package checks
# https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates
include:
  - project: "developer-ecosystem/ci-job-templates"
    ref: master
    file: "/rollups/all-projects.gitlab-ci.yml"

stages:
  - priority
  - static
  - deploy_to_server

# Overrride some properties on FIT jobs. Unfortunately using a template for these
# make GitLab angry, so a lot of repetition
project-check:
  stage: static
  needs: ["test"]
  dependencies: [] # doesn't actually need artifacts
  tags: ["docker", "linux"]
  timeout: 10 minutes
eslint-sast:
  stage: static
  needs: ["test"]
  dependencies: [] # doesn't actually need artifacts
  tags: ["docker", "linux"]
  timeout: 10 minutes
nodejs-scan-sast:
  stage: static
  needs: ["install_dependencies"] # nodejs-scan-sast takes a while, don't wait for "test" job
  dependencies: [] # doesn't actually need artifacts
  tags: ["docker", "linux"]
  timeout: 10 minutes
semgrep-sast:
  stage: static
  needs: ["test"]
  dependencies: [] # doesn't actually need artifacts
  tags: ["docker", "linux"]
  timeout: 10 minutes
sast:
  stage: static
  needs: ["test"]
  dependencies: [] # doesn't actually need artifacts
  tags: ["docker", "linux"]
  timeout: 10 minutes

# manually overwrite the dependency-check to add our own suppression.xml
dependency-check:
  stage: static
  needs: ["install_dependencies"] # dependency-check takes a while, don't wait for "test" job
  tags: ["docker", "linux"]
  timeout: 10 minutes
  image:
    # Specify the Docker image to be used for the job, which is a customized image for running OWASP
    # dependency-check in a GitLab CI job
    name: $CI_REGISTRY/developer-ecosystem/dependency-check:latest
    # Entrypoint is overridden to allow a script to be run
    entrypoint: [""]
  script:
    # Run dependency-check from the location installed in the Docker container with the following arguments:
    # --scan "./"                                         Scans all files and folders within the working folder,
    #                                                     which contains the repository files as well as any
    #                                                     artifacts from prior jobs in the pipeline
    # --format ALL                                        Saves output in all formats so that HTML and JSON
    #                                                     files are available
    # --project "$CI_PROJECT_NAME"                        Use the GitLab project name, which is included in
    #                                                     the report
    # --failOnCVSS 0                                      Forces job to fail if any vulnerabilities are found
    # --suppression /suppressions/fp-cpe-suppression.xml  Suppress false positives where the dependency is
    #                                                     improperly identified
    # --suppression /suppressions/fp-cve-suppression.xml  Suppress false positives where the dependency is
    #                                                     properly identified, but the  CVE is a false positive
    - /usr/share/dependency-check/bin/dependency-check.sh --scan "./" --format ALL --project "$CI_PROJECT_NAME" --failOnCVSS 0 --suppression /suppressions/fp-cpe-suppression.xml --suppression /suppressions/fp-cve-suppression.xml --suppression ./ci/suppression.xml
  # Allow failure will report a failure, but continue execution of the pipeline
  allow_failure: true
  artifacts:
    # Saving artifacts always forces them to be saved on failure as well as success
    when: always
    # Save the HTML and JSON formatted results as artifacts
    paths:
      - "./dependency-check-report.html"
      - "./dependency-check-report.json"

install_dependencies:
  stage: priority
  tags: ["docker", "linux"]
  script:
    - npm ci
  artifacts:
    expire_in: 1 day
    paths:
      - ./node_modules/*

test:
  stage: priority
  needs: ["install_dependencies"]
  tags: ["docker", "linux"]
  script:
    - npm run lint
    - npm t

build:
  stage: priority
  needs: ["install_dependencies"]
  tags: ["docker", "linux"]
  script:
    - npm run build
  artifacts:
    paths:
      - .next
      - dist

##
## A hidden job for setting up SSH that is never executed by itself. Instead, we use the `extends`
## keyword in other jobs to execute this script and setup SSH during deployments
##
.setup_ssh:
  before_script:
    ## See https://docs.gitlab.com/ee/ci/ssh_keys/index.html#ssh-keys-when-using-the-docker-executor
    ##
    ## Install ssh-agent if not already installed, it is required by Docker.
    ## (change apt-get to yum if you use an RPM-based image)
    ##
    - "command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )"

    ##
    ## Install rsync
    ##
    - "which rsync || ( apt-get update -y && apt-get install rsync -y )"

    ##
    ## Run ssh-agent (inside the build environment)
    ##
    - eval $(ssh-agent -s)

    ##
    ## Create the SSH directory and give it the right permissions
    ##
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    ##
    ## Add the FIT server host to known_hosts
    ##
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

    ## Since servers may have different private keys, we need to be able to set a variable
    ## for each job saying what the name of the key in GitLab Variables is called. This
    ## extracts the key based on the passed in variable name.
    - SSH_PRIVATE_KEY_VALUE=${!SSH_PRIVATE_KEY_VAR_NAME}

    ##
    ## Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    ## We're using tr to fix line endings which makes ed25519 keys work
    ## without extra base64 encoding.
    ## https://gitlab.com/gitlab-examples/ssh-private-key/issues/1#note_48526556
    ##
    - echo "$SSH_PRIVATE_KEY_VALUE" | tr -d '\r' | ssh-add -

.deploy_template:
  tags:
    - emss-deploy
  extends: .setup_ssh
  image: node:14 # Can't use Alpine Linux here without changing the apt-get commands above
  stage: deploy_to_server
  script:
    # sync the transpiled front-end and backend code on the server at /opt/fitbox/apps/coda
    - rsync -acrvz --delete --exclude=node_modules --exclude=.env.local --exclude=.git "$PWD" fitboxer@${ENVIRONMENT_HOSTNAME}.ndc.nasa.gov:/opt/fitbox/apps

    # check dependencies then wait 5 seconds to prevent issue #101 before restarting the server
    - >
      ssh fitboxer@${ENVIRONMENT_HOSTNAME}.ndc.nasa.gov "
      cd /opt/fitbox/apps/coda &&

      echo -e '\nInstall dependencies' &&
      npm i &&

      sleep 5 &&

      echo -e '\nRestart the server' &&
      sudo systemctl daemon-reload &&
      sudo systemctl restart coda"

deploy_to_dev1:
  extends: .deploy_template
  needs: ["install_dependencies", "build"]
  variables:
    ENVIRONMENT_HOSTNAME: jsfitdcoda01
    SSH_PRIVATE_KEY_VAR_NAME: SSH_PRIVATE_KEY_FITBOXER_DEV1
  environment:
    name: development1
    url: https://coda-dev.fit.nasa.gov
  only:
    - /^.*--dev1$/

deploy_to_dev2:
  extends: .deploy_template
  needs: ["install_dependencies", "build"]
  variables:
    ENVIRONMENT_HOSTNAME: jsfitdcoda02
    SSH_PRIVATE_KEY_VAR_NAME: SSH_PRIVATE_KEY_FITBOXER_DEV2
  environment:
    name: development2
    url: https://coda-dev2.fit.nasa.gov
  only:
    - /^.*--dev2$/

deploy_to_integration:
  extends: .deploy_template
  needs:
    - "install_dependencies"
    - "build"
    - { job: "test", artifacts: false }
  variables:
    ENVIRONMENT_HOSTNAME: jsfiticoda
    SSH_PRIVATE_KEY_VAR_NAME: SSH_PRIVATE_KEY_FITBOXER_INT
  environment:
    name: integration
    url: https://coda-int.fit.nasa.gov
  only:
    - int

deploy_to_production:
  extends: .deploy_template
  needs:
    - "install_dependencies"
    - "build"
    - { job: "test", artifacts: false }
    - { job: "project-check", artifacts: false }
    - { job: "phpcs-security-audit-sast", artifacts: false }
    - { job: "eslint-sast", artifacts: false }
    - { job: "nodejs-scan-sast", artifacts: false }
    - { job: "semgrep-sast", artifacts: false }
    - { job: "dependency-check", artifacts: false }
  variables:
    ENVIRONMENT_HOSTNAME: jsfitpcoda
    SSH_PRIVATE_KEY_VAR_NAME: SSH_PRIVATE_KEY_FITBOXER_PROD
  environment:
    name: production
    url: https://coda.fit.nasa.gov
  when: manual
  only:
    - prod
