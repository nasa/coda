# Prefixing with x- just means this isn't actually used by Docker Compose.
# Instead, this holds values that are included elsewhere in this file.
x-wrapper: &send_container_logs_to_syslog
  # `logging` property to be added to any services below where we want logs.
  # In FIT, adding this to a service makes the service log to the VM's
  # Rsyslog service running on the host. In local dev we would need to stand
  # up an Rsyslog of some type, perhaps in a container, that could forward
  # logs from a locally-running app to a locally-running logging server.
  logging:
    driver: syslog
    options:
      syslog-address: "${LOG_INTERNAL_ENDPOINT}"
      # If syslog-address endpoint goes down, don't freak out
      mode: "non-blocking"
      # This tag sends the container name to the logging server, where the
      # container name is the app ID plus the service name. See the
      # `container_name` properties for the apps below.
      # Unfortunately the container name can't just be the service name, i.e.
      # "nginx", because then in local dev if you want to have both CODA and
      # AEGIS running simultaneously then the second will fail because there
      # is already an "nginx" container present. So container names are
      # prefixed with their LOG_DATA_APP_ID. The log server splits this up
      # to store the app ID and service name separately. The server name,
      # e.g. "carbon", is handled entirely by the host's Rsyslog config.
      tag: "{{.Name}}"

services:
  nginx:
    container_name: "${LOG_DATA_APP_ID}--nginx"
    image: ${REGISTRY_IMAGE}/nginx:${IMAGE_VERSION}
    restart: always
    depends_on:
      - apiv1
    <<: *send_container_logs_to_syslog
    environment:
      # Hostname of the shared oauth2-proxy this app delegates auth_request to.
      # docker-entrypoint.sh envsubst's this into setup-auth-unified.conf at
      # container start. See env.config.ts for per-environment values.
      AUTH_HOST: ${AUTH_HOST}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
    volumes:
      - ${DOCKER_HOST_SSL_CERTS_DIR}:/etc/pki/tls/certs
      - ${DOCKER_HOST_SSL_PRIVATE_DIR}:/etc/pki/tls/private
    ports:
      # launchpad must be over HTTPS and not have a port specified in the URL
      # e.g. https://coda.fit.nasa.gov not https://coda.fit.nasa.gov:8000
      - "443:443"

  apiv1:
    container_name: "${LOG_DATA_APP_ID}--apiv1"
    image: ${REGISTRY_IMAGE}/apiv1:${IMAGE_VERSION}
    depends_on:
      database:
        condition: service_healthy
    <<: *send_container_logs_to_syslog
    restart: always
    env_file:
      # Any .env variables needed at runtime must be specified here or listed out in the `environment` property
      #
      # First the .env file is used to SET environment variables on the container. The .env file is
      # NOT actually moved over onto the container, just the variables are set.
      - ./.env

  database:
    container_name: "${LOG_DATA_APP_ID}--database"
    image: ${DOCKER_IMAGE_DATABASE} # from env.config.ts
    restart: always
    <<: *send_container_logs_to_syslog
    environment:
      # Used for setting up a DB for the first time. These are not stored in the container
      # but rather in the db data itself
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: "pg_isready -U postgres && psql --username=postgres --list && psql --username=postgres ${DB_NAME} -c 'SELECT tablename FROM pg_catalog.pg_tables LIMIT 1'"
      interval: 30s # how often to check health
      timeout: 5s # fail if it takes longer than this
      retries: 6 # max consecutive failures
      start_period: 15s # db takes about 20 seconds to come up
    volumes:
      # map the DB data to be stored outside the container
      - ${DOCKER_DB_DATA_DIR}:/var/lib/postgresql/data
      - ${DOCKER_DB_INIT_DIR}:/docker-entrypoint-initdb.d
